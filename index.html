function Icon({ name, size = 16, className, style, strokeWidth = 2 }) {

/* ---------- 결정론적 유사난수 ---------- */
function noise(i, seed) {
  const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
  return x - Math.floor(x);
}

/* ---------- 실측 앵커 기반 거시 모델 (m: 0 = 2023-01) ----------
 * END_M(차트 종점)은 페이지를 여는 시점의 현재 월로 자동 계산된다 → 날짜 자동 갱신.
 * 갱신 시에는 LATEST의 6개 "실측 원값"만 교체한다(보정 상수 수기 입력 불필요).
 * 2026-08-06 실측 교차검증(8/5 종가/최근치): Fed 3.625%(7/29 FOMC 동결, 다음 회의 9/16, 변동 없음) · BOK 2.75%(7/16 만장일치 인상 후 유지, 8/27 금통위 대기, 변동 없음) · UST10Y 4.62%(8/5, -2bp)
 *   KTB3Y 3.669%(8/5, -7.1bp, 국제유가 급락) · S&P500 7,723.55(8/5, -0.17%/-12.97p, 4일 연속 상승 마감·다우는 사상 최고 종가) · KOSPI 6,598.26(8/5, +3.76%/+239.31p 급등, 반도체 투톱 강세)
 */
const START_DATE = new Date(2023, 0, 1);
const END_M = (() => {
  const now = new Date();
  return (now.getFullYear() - START_DATE.getFullYear()) * 12 + (now.getMonth() - START_DATE.getMonth());
})();

// ★ 스케줄 갱신 대상: 아래 6개 실측 원값만 교체한다
const LATEST = {
  usRate: 3.625,  // 미 연방기금금리 목표범위 중간값 (7/29 FOMC 동결)
  krRate: 2.75,   // 한국은행 기준금리 (7/16 인상, 8/27 금통위 대기)
  us10y: 4.62,    // UST 10Y, 2026-08-05
  kr3y: 3.669,    // KTB 3Y, 2026-08-05
  sp500: 7723.55, // S&P 500, 2026-08-05 종가
  kospi: 6598.26, // KOSPI, 2026-08-05 종가
};

function interp(anchors, m) {
  if (m <= anchors[0][0]) return anchors[0][1];
  const end = anchors[anchors.length - 1];
  if (m >= end[0]) return end[1];
  for (let k = 1; k < anchors.length; k++) {
    if (m <= anchors[k][0]) {
      const [m0, v0] = anchors[k - 1];
      const [m1, v1] = anchors[k];
      return v0 + ((m - m0) / (m1 - m0)) * (v1 - v0);
    }
  }
  return end[1];
}
// 과거 앵커 뒤에 m=END_M 종점을 붙인다. END_M 이후로 밀려난 과거 앵커는 자동 제거.
function withEnd(base, endValue) {
  return [...base.filter((p) => p[0] < END_M), [END_M, endValue]];
}
const A_US_RATE = withEnd([[0, 4.375], [6, 5.375], [20, 5.375], [30, 4.375], [40, 3.625], [42, 3.625]], LATEST.usRate);
const A_KR_RATE = withEnd([[0, 3.5], [21, 3.5], [30, 2.875], [38, 2.5], [41, 2.5], [42, 2.75]], LATEST.krRate);
// 종점 앵커는 파동 오프셋을 역산해 m=END_M에서 실측값에 정확히 수렴시킨다.
const A_US_SP = withEnd([[0, 3850], [6, 4400], [11, 4750], [17, 5450], [23, 5850], [29, 6150], [35, 6650], [40, 7300]],
  LATEST.sp500 - 70 * Math.sin(END_M / 3.2));
const A_KR_KOSPI = withEnd([[0, 2250], [6, 2580], [12, 2650], [18, 2750], [24, 2400], [30, 2900], [36, 4300], [39, 6500], [41, 8400]],
  LATEST.kospi / (1 + 0.02 * Math.sin(END_M / 3.5 + 1)));
const A_US_10Y = withEnd([[0, 3.55], [9, 4.9], [15, 4.1], [20, 3.85], [27, 4.3], [33, 4.2], [40, 4.45]],
  LATEST.us10y - 0.06 * Math.sin(END_M / 4));
const A_KR_3Y = withEnd([[0, 3.7], [8, 3.85], [16, 3.3], [26, 2.75], [34, 2.6], [40, 3.6]],
  LATEST.kr3y - 0.04 * Math.sin(END_M / 3.6));

function usRate(m) { return interp(A_US_RATE, m); }
function krRate(m) { return interp(A_KR_RATE, m); }
function usPrice(m) { return interp(A_US_SP, m) + 70 * Math.sin(m / 3.2); }
function krPrice(m) { return interp(A_KR_KOSPI, m) * (1 + 0.02 * Math.sin(m / 3.5 + 1)); }
function usBond10y(m) { return +(interp(A_US_10Y, m) + 0.06 * Math.sin(m / 4)).toFixed(3); }
function krBond3y(m) { return +(interp(A_KR_3Y, m) + 0.04 * Math.sin(m / 3.6)).toFixed(3); }
function krDeposit(m, price) {
  const senti = (price - 2250) / 2250;
  return Math.round((45 + senti * 16) * 10) / 10;
}

const MARKETS = {
  US: { key: "US", label: "US Market · S&P 500", short: "미장", unit: "pt", rateLabel: "Fed Funds", bondLabel: "UST 10Y",
    accent: "#38bdf8", seed: 11, rate: usRate, bond: usBond10y, price: usPrice, volBase: 4200, hasDeposit: false, flag: "🇺🇸" },
  KR: { key: "KR", label: "KR Market · KOSPI", short: "국장", unit: "pt", rateLabel: "BOK Base", bondLabel: "KTB 3Y",
    accent: "#f472b6", seed: 29, rate: krRate, bond: krBond3y, price: krPrice, volBase: 720, hasDeposit: true, flag: "🇰🇷" },
};

const TF = {
  Monthly: { key: "Monthly", label: "Monthly", count: END_M + 1, step: 1, amp: 0.5, window: 4 },
  Weekly: { key: "Weekly", label: "Weekly", count: 52, step: 1 / 4.33, amp: 1.15, window: 6 },
  Daily: { key: "Daily", label: "Daily", count: 90, step: 1 / 21, amp: 2.0, window: 10 },
};
// END_M / START_DATE는 파일 상단(거시 모델 섹션)에서 현재 월 기준으로 자동 산출된다.

function fmtDate(m, tf) {
  const d = new Date(START_DATE.getTime() + Math.round(m * 30.44) * 86400000);
  const yy = String(d.getFullYear()).slice(2);
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  if (tf === "Monthly") return `${yy}.${mm}`;
  return `${mm}/${dd}`;
}

function buildSeries(tfKey, mkt) {
  const tf = TF[tfKey];
  const startM = tfKey === "Monthly" ? 0 : END_M - (tf.count - 1) * tf.step;
  const raw = [];
  for (let i = 0; i < tf.count; i++) {
    const m = startM + i * tf.step;
    const base = mkt.price(m);
    const n = (noise(i, mkt.seed) - 0.5) * 2 * (tf.amp / 100) * base;
    const price = Math.round(base + n);
    const rate = +mkt.rate(m).toFixed(2);
    const bond = mkt.bond(m);
    const row = { i, m, date: fmtDate(m, tfKey), price, rate, bond };
    if (mkt.hasDeposit) row.deposit = krDeposit(m, base);
    raw.push(row);
  }
  for (let i = 0; i < raw.length; i++) {
    const prev = raw[Math.max(0, i - 1)].price;
    const ret = Math.abs((raw[i].price - prev) / prev);
    const spike = 1 + ret * 22 + (noise(i, mkt.seed + 5) - 0.4) * 0.5;
    raw[i].volume = Math.round(mkt.volBase * Math.max(0.45, spike));
    raw[i].up = raw[i].price >= prev;
  }
  return raw;
}

const PHASES = {
  A1: { id: "A1", name: "A1 · 조정 국면 (바닥)", stance: "분할 매수 시작", tone: "buy", angle: 215,
    desc: "금리 정점 후 하락 전환, 거래량 최저. 소수만 보유하는 침체 국면. 저가 분할 매수가 유효한 구간." },
  A2: { id: "A2", name: "A2 · 동행 국면 (상승)", stance: "보유 · 눌림목 매수", tone: "hold", angle: 150,
    desc: "금리 인하와 거래량이 동반 상승. 추세 추종 구간으로 보유 지속 및 조정 시 추가 매수." },
  A3: { id: "A3", name: "A3 · 과열 국면 (천정)", stance: "분할 매도 · 차익 실현", tone: "sell", angle: 90,
    desc: "거래량 폭증과 신고가 경신. 다수가 낙관하는 과열 구간. 분할 매도로 차익 실현 권고." },
  B1: { id: "B1", name: "B1 · 조정 국면 (하락 초입)", stance: "비중 축소 · 매도", tone: "sell", angle: 25,
    desc: "고점 대비 하락 전환, 거래량 감소. 반등 시마다 비중을 줄여 리스크를 관리할 국면." },
  B2: { id: "B2", name: "B2 · 동행 국면 (하락 지속)", stance: "현금 보유 · 관망", tone: "wait", angle: 330,
    desc: "금리 고점 유지 속 하락 추세 지속. 현금 비중을 확대하고 섣부른 진입을 삼갈 것." },
  B3: { id: "B3", name: "B3 · 과열 국면 (투매)", stance: "매수 적기 · 적극 매수", tone: "buy", angle: 270,
    desc: "투매로 인한 거래량 폭증, 공포 극대화. 역발상 관점의 매수 적기 구간." },
};
const TONE = {
  buy: { color: "#34d399", bg: "rgba(52,211,153,0.12)", border: "rgba(52,211,153,0.5)", iconName: "TrendingUp", tag: "BUY" },
  hold: { color: "#38bdf8", bg: "rgba(56,189,248,0.12)", border: "rgba(56,189,248,0.5)", iconName: "ArrowUpRight", tag: "HOLD" },
  sell: { color: "#f87171", bg: "rgba(248,113,113,0.12)", border: "rgba(248,113,113,0.5)", iconName: "TrendingDown", tag: "SELL" },
  wait: { color: "#fbbf24", bg: "rgba(251,191,36,0.12)", border: "rgba(251,191,36,0.5)", iconName: "AlertTriangle", tag: "WAIT" },
};

function detectPhase(series, tfKey) {
  const tf = TF[tfKey];
  const n = series.length;
  const last = series[n - 1];
  const past = series[Math.max(0, n - 1 - tf.window)];
  const priceRet = (last.price - past.price) / past.price;
  const rateChange = last.rate - past.rate;
  const prices = series.map((d) => d.price);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const pricePct = (last.price - min) / (max - min || 1);
  const avgVol = series.reduce((s, d) => s + d.volume, 0) / n;
  const volZ = (last.volume - avgVol) / avgVol;
  const bondChange = last.bond - past.bond;
  const rateSignal = rateChange + bondChange * 0.3;
  const rising = priceRet > 0.008;
  const falling = priceRet < -0.008;
  const volHigh = volZ > 0.3;
  const rateFalling = rateSignal < -0.06;
  const rateRising = rateSignal > 0.06;

  let id;
  if (rateFalling) {
    if (pricePct > 0.7) id = "A3";
    else if (pricePct < 0.4 && !falling) id = "A1";
    else id = "A2";
  } else if (rateRising) {
    if (pricePct < 0.34 && (volHigh || falling)) id = "B3";
    else if (pricePct > 0.6 || !falling) id = "B1";
    else id = "B2";
  } else {
    if (rising && pricePct > 0.7) id = "A3";
    else if (falling && pricePct < 0.34 && volHigh) id = "B3";
    else if (rising && pricePct < 0.4) id = "A1";
    else if (falling && pricePct > 0.55) id = "B1";
    else if (rising) id = "A2";
    else if (falling) id = "B2";
    else id = pricePct > 0.6 ? "B1" : "A2";
  }
  return { phase: PHASES[id], metrics: { priceRet, rateChange, bondChange, pricePct, volZ, deposit: last.deposit } };
}

function ChartTooltip({ active, payload, label, unit, bondLabel }) {
  if (!active || !payload || !payload.length) return null;
  const get = (k) => { const p = payload.find((x) => x.dataKey === k); return p ? p.value : undefined; };
  const dep = get("deposit");
  return (
    <div className="rounded-md border border-slate-700 bg-slate-900/95 px-3 py-2 text-xs shadow-xl">
      <div className="mb-1 font-mono text-slate-400">{label}</div>
      <div className="text-slate-100">지수 <span className="font-semibold text-sky-300">{get("price") != null ? get("price").toLocaleString() : ""}</span> {unit}</div>
      <div className="text-slate-100">기준금리 <span className="font-semibold text-amber-300">{get("rate")}%</span></div>
      <div className="text-slate-100">{bondLabel} <span className="font-semibold text-teal-300">{get("bond")}%</span></div>
      {dep != null && <div className="text-slate-100">예탁금 <span className="font-semibold text-violet-300">{dep}조</span></div>}
    </div>
  );
}
function VolTooltip({ active, payload, label }) {

      <div className="text-slate-100">거래량 <span className="font-semibold text-slate-200">{payload[0].value != null ? payload[0].value.toLocaleString() : ""}</span></div>
    </div>
  );
}

function EggIndicator({ usPhase, krPhase }) {
  const CX = 170, CY = 200, RX = 118, RY = 165;
  const pos = (angle) => { const rad = (angle * Math.PI) / 180; return { x: CX + RX * Math.cos(rad), y: CY - RY * Math.sin(rad) }; };
  return (
    <svg viewBox="0 0 340 410" className="mx-auto h-full w-full" style={{ maxWidth: 340 }}>
      <defs>
        <radialGradient id="eggFill" cx="50%" cy="38%" r="70%">
          <stop offset="0%" stopColor="#1e293b" /><stop offset="100%" stopColor="#0b1220" />
        </radialGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="5" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>
      <ellipse cx={CX} cy={CY} rx={RX} ry={RY} fill="url(#eggFill)" stroke="#334155" strokeWidth="1.5" />
      <ellipse cx={CX} cy={CY} rx={RX} ry={RY} fill="none" stroke="#475569" strokeWidth="0.5" strokeDasharray="3 5" opacity="0.5" />
      <text x={CX} y={26} textAnchor="middle" fill="#f87171" fontSize="11" fontWeight="700">▲ 천정 · 과열 (매도)</text>
      <text x={CX} y={402} textAnchor="middle" fill="#34d399" fontSize="11" fontWeight="700">▼ 바닥 · 침체 (매수)</text>
      <text x={20} y={CY} textAnchor="middle" fontSize="10" fill="#64748b" transform={`rotate(-90 20 ${CY})`}>A1~A3 · 금리 하락기 (주식 매수)</text>
      <text x={322} y={CY} textAnchor="middle" fontSize="10" fill="#64748b" transform={`rotate(90 322 ${CY})`}>B1~B3 · 금리 상승기 (예금 확보)</text>
      {Object.values(PHASES).map((ph) => {
        const p = pos(ph.angle); const t = TONE[ph.tone];
        const active = usPhase.id === ph.id || krPhase.id === ph.id;
        return (
          <g key={ph.id}>
            <circle cx={p.x} cy={p.y} r={active ? 15 : 11} fill={active ? t.color : "#1e293b"} stroke={t.color}
              strokeWidth={active ? 2.5 : 1.5} opacity={active ? 1 : 0.65} filter={active ? "url(#glow)" : undefined} />
            <text x={p.x} y={p.y + 4} textAnchor="middle" fontSize="11" fontWeight="700" fill={active ? "#0b1220" : t.color}>{ph.id}</text>
          </g>
        );
      })}
      {[{ ph: usPhase, color: MARKETS.US.accent, tag: "US", dx: -16 }, { ph: krPhase, color: MARKETS.KR.accent, tag: "KR", dx: 16 }].map(({ ph, color, tag, dx }) => {
        const p = pos(ph.angle);
        return (
          <g key={tag}>
            <circle cx={p.x + dx} cy={p.y - 26} r="4.5" fill={color}>
              <animate attributeName="r" values="4.5;7;4.5" dur="1.6s" repeatCount="indefinite" />
            </circle>
            <text x={p.x + dx} y={p.y - 34} textAnchor="middle" fontSize="9" fontWeight="800" fill={color}>{tag}</text>
          </g>
        );
      })}
    </svg>
  );
}

function PositionCard({ mkt, phase, metrics }) {
  const t = TONE[phase.tone];
  return (
    <div className="rounded-lg border p-4" style={{ background: t.bg, borderColor: t.border }}>
      <div className="mb-2 flex items-center justify-between">
        <div className="flex items-center gap-2"><span className="text-lg">{mkt.flag}</span><span className="text-sm font-semibold text-slate-200">{mkt.short}</span></div>
        <span className="rounded px-2 py-0.5 text-[11px] font-bold tracking-wider" style={{ background: t.color, color: "#0b1220" }}>{t.tag}</span>
      </div>
      <div className="mb-1 flex items-center gap-2">
        <Icon name={t.iconName} size={18} style={{ color: t.color }} />
        <span className="text-base font-bold" style={{ color: t.color }}>{phase.name}</span>
      </div>
      <p className="mb-3 text-xs leading-relaxed text-slate-300">{phase.desc}</p>
      <div className="flex items-center gap-2 rounded-md bg-slate-950/50 px-3 py-2">
        <Icon name="AlertTriangle" size={14} style={{ color: t.color }} />
        <span className="text-xs font-semibold text-slate-100">권장 포지션: {phase.stance}</span>
      </div>
      <div className="mt-3 grid grid-cols-3 gap-2 text-center text-[11px]">
        <div className="rounded bg-slate-950/40 py-1.5"><div className="text-slate-500">추세</div>
          <div className={metrics.priceRet >= 0 ? "font-semibold text-emerald-400" : "font-semibold text-red-400"}>{(metrics.priceRet * 100).toFixed(1)}%</div></div>
        <div className="rounded bg-slate-950/40 py-1.5"><div className="text-slate-500">금리Δ</div>
          <div className={metrics.rateChange <= 0 ? "font-semibold text-emerald-400" : "font-semibold text-red-400"}>{metrics.rateChange > 0 ? "+" : ""}{metrics.rateChange.toFixed(2)}</div></div>
        <div className="rounded bg-slate-950/40 py-1.5"><div className="text-slate-500">거래량</div>
          <div className={metrics.volZ >= 0.3 ? "font-semibold text-amber-400" : "font-semibold text-slate-300"}>{metrics.volZ >= 0 ? "+" : ""}{(metrics.volZ * 100).toFixed(0)}%</div></div>
      </div>
    </div>
  );
}

function TF_INTERVAL(series) {
  const n = series.length;
  if (n <= 45) return 3;
  if (n <= 55) return 6;
  return 12;
}

function MarketPanel({ mkt, series, phase, side }) {
  const last = series[series.length - 1];
  const prev = series[series.length - 2] || last;
  const chg = ((last.price - prev.price) / prev.price) * 100;
  const t = TONE[phase.tone];
  return (
    <div className="flex flex-col rounded-xl border border-slate-800 bg-slate-900/40 p-4">
      <div className="mb-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <span className="text-xl">{mkt.flag}</span>
          <div><div className="text-sm font-bold text-slate-100">{mkt.label}</div>
            <div className="text-[11px] uppercase tracking-wider" style={{ color: mkt.accent }}>{side} PANEL</div></div>
        </div>
        <div className="text-right">
          <div className="font-mono text-lg font-bold text-slate-100">{last.price.toLocaleString()}<span className="ml-1 text-xs text-slate-500">{mkt.unit}</span></div>
          <div className={`flex items-center justify-end gap-1 text-xs font-semibold ${chg >= 0 ? "text-emerald-400" : "text-red-400"}`}>
            <Icon name={chg >= 0 ? "ArrowUpRight" : "ArrowDownRight"} size={13} />{chg >= 0 ? "+" : ""}{chg.toFixed(2)}%</div>
        </div>
      </div>
      <div className="mb-2 flex items-center gap-2 rounded-md border px-3 py-1.5" style={{ borderColor: t.border, background: t.bg }}>
        <Icon name="Egg" size={15} style={{ color: t.color }} /><span className="text-xs font-bold" style={{ color: t.color }}>현재 국면: {phase.name}</span>
      </div>
      <div className="mb-2 grid grid-cols-3 gap-2 text-center text-[11px]">
        <div className="rounded bg-slate-950/50 py-1"><div className="text-slate-500">{mkt.rateLabel}</div><div className="font-mono font-semibold text-amber-300">{last.rate}%</div></div>
        <div className="rounded bg-slate-950/50 py-1"><div className="text-slate-500">{mkt.bondLabel}</div><div className="font-mono font-semibold text-teal-300">{last.bond}%</div></div>
        <div className="rounded bg-slate-950/50 py-1"><div className="text-slate-500">{mkt.hasDeposit ? "고객예탁금" : "10Y 스프레드"}</div>
          <div className="font-mono font-semibold text-violet-300">{mkt.hasDeposit ? `${last.deposit}조` : `${(last.bond - last.rate).toFixed(2)}%`}</div></div>
      </div>
      <div style={{ height: 220 }}>
        <ResponsiveContainer width="100%" height="100%">
          <ComposedChart data={series} margin={{ top: 8, right: 8, left: -8, bottom: 0 }}>
            <defs>
              <linearGradient id={`grad-${mkt.key}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={mkt.accent} stopOpacity={0.5} /><stop offset="100%" stopColor={mkt.accent} stopOpacity={0.02} />
              </linearGradient>
            </defs>
            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
            <XAxis dataKey="date" tick={{ fill: "#64748b", fontSize: 10 }} interval={TF_INTERVAL(series)} axisLine={{ stroke: "#334155" }} tickLine={false} />
            <YAxis yAxisId="price" orientation="right" tick={{ fill: "#64748b", fontSize: 10 }} axisLine={false} tickLine={false} domain={["auto", "auto"]} width={46} />
            <YAxis yAxisId="rate" orientation="left" tick={{ fill: "#fbbf24", fontSize: 10 }} axisLine={false} tickLine={false} domain={[0, 8]} width={28} tickFormatter={(v) => `${v}%`} />
            <Tooltip content={<ChartTooltip unit={mkt.unit} bondLabel={mkt.bondLabel} />} />
            <Area yAxisId="price" type="monotone" dataKey="price" stroke={mkt.accent} strokeWidth={2} fill={`url(#grad-${mkt.key})`} name="지수" />
            <Line yAxisId="rate" type="monotone" dataKey="rate" stroke="#fbbf24" strokeWidth={1.8} dot={false} name="기준금리" />
            <Line yAxisId="rate" type="monotone" dataKey="bond" stroke="#2dd4bf" strokeWidth={1.4} strokeDasharray="4 3" dot={false} name={mkt.bondLabel} />
          </ComposedChart>
        </ResponsiveContainer>
      </div>
      <div className="mt-1 flex items-center gap-1.5 text-[11px] text-slate-500"><Icon name="BarChart3" size={12} /> 거래량 (Volume)</div>
      <div style={{ height: 76 }}>
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={series} margin={{ top: 4, right: 8, left: -8, bottom: 0 }}>
            <XAxis dataKey="date" hide /><YAxis hide domain={[0, "auto"]} />
            <Tooltip content={<VolTooltip />} cursor={{ fill: "rgba(148,163,184,0.08)" }} />
            <Bar dataKey="volume" radius={[1, 1, 0, 0]}>
              {series.map((d, idx) => (<Cell key={idx} fill={d.up ? "rgba(52,211,153,0.55)" : "rgba(248,113,113,0.55)"} />))}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function KostolanyEggDashboard() {
  const [tf, setTf] = useState("Monthly");
  const [clock, setClock] = useState(new Date());
  useEffect(() => { const id = setInterval(() => setClock(new Date()), 1000); return () => clearInterval(id); }, []);
  const usSeries = useMemo(() => buildSeries(tf, MARKETS.US), [tf]);
  const krSeries = useMemo(() => buildSeries(tf, MARKETS.KR), [tf]);
  const usDx = useMemo(() => detectPhase(usSeries, tf), [usSeries, tf]);
  const krDx = useMemo(() => detectPhase(krSeries, tf), [krSeries, tf]);
  const pad = (x) => String(x).padStart(2, "0");
  const ts = `${clock.getFullYear()}/${pad(clock.getMonth() + 1)}/${pad(clock.getDate())} ${pad(clock.getHours())}:${pad(clock.getMinutes())}:${pad(clock.getSeconds())}`;

  return (
    <div className="min-h-screen w-full bg-slate-950 font-sans text-slate-200">
      <div className="mx-auto max-w-7xl px-4 py-5">
        <header className="mb-5 flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
          <div className="flex items-center gap-3">
            <div className="flex h-10 w-10 items-center justify-center rounded-lg bg-gradient-to-br from-amber-400 to-orange-500 text-slate-950"><Icon name="Egg" size={22} strokeWidth={2.4} /></div>
            <div>
              <h1 className="text-lg font-bold tracking-tight text-slate-50">KOSTOLANY EGG · Macro Regime Terminal</h1>
              <div className="flex items-center gap-2 text-[11px] text-slate-500"><Icon name="Clock" size={11} /><span className="font-mono">{ts}</span><span className="text-slate-700">|</span><span>KOSPI · S&P 500 국면 진단</span></div>
            </div>
          </div>
          <div className="flex items-center gap-1 rounded-lg border border-slate-800 bg-slate-900/60 p-1">
            {Object.values(TF).map((x) => (
              <button key={x.key} onClick={() => setTf(x.key)}
                className={`rounded-md px-4 py-1.5 text-xs font-semibold transition-all ${tf === x.key ? "bg-amber-500 text-slate-950 shadow" : "text-slate-400 hover:bg-slate-800 hover:text-slate-200"}`}>
                {x.label === "Monthly" ? "월간" : x.label === "Weekly" ? "주간" : "일간"}</button>
            ))}
          </div>
        </header>

        <section className="mb-5 rounded-xl border border-slate-800 bg-slate-900/40 p-4">
          <div className="mb-3 flex items-center gap-2">
            <Icon name="Activity" size={16} className="text-amber-400" />
            <h2 className="text-sm font-bold text-slate-100">코스톨라니 국면 시뮬레이터</h2>
            <span className="rounded bg-slate-800 px-2 py-0.5 text-[10px] text-slate-400">{tf === "Monthly" ? "월간" : tf === "Weekly" ? "주간" : "일간"} 기준 실시간 진단</span>
          </div>
          <div className="grid grid-cols-1 gap-4 lg:grid-cols-[1fr_1.3fr]">
            <div className="flex items-center justify-center rounded-lg bg-slate-950/40 p-2" style={{ minHeight: 340 }}>
              <EggIndicator usPhase={usDx.phase} krPhase={krDx.phase} />
            </div>
            <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
              <PositionCard mkt={MARKETS.US} phase={usDx.phase} metrics={usDx.metrics} />
              <PositionCard mkt={MARKETS.KR} phase={krDx.phase} metrics={krDx.metrics} />
            </div>
          </div>
        </section>

        <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
          <MarketPanel mkt={MARKETS.US} series={usSeries} phase={usDx.phase} side="LEFT" />
          <MarketPanel mkt={MARKETS.KR} series={krSeries} phase={krDx.phase} side="RIGHT" />
        </div>

        <footer className="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-slate-800 pt-4 text-[11px] text-slate-500">
          <div className="flex flex-wrap items-center gap-4">
            <span className="flex items-center gap-1.5"><span className="inline-block h-2.5 w-2.5 rounded-full" style={{ background: MARKETS.US.accent }} /> S&P 500</span>
            <span className="flex items-center gap-1.5"><span className="inline-block h-2.5 w-2.5 rounded-full" style={{ background: MARKETS.KR.accent }} /> KOSPI</span>
            <span className="flex items-center gap-1.5"><span className="inline-block h-0.5 w-4" style={{ background: "#fbbf24" }} /> 기준금리</span>
            <span className="flex items-center gap-1.5"><span className="inline-block h-0.5 w-4 border-t border-dashed" style={{ borderColor: "#2dd4bf" }} /> 국채금리(10Y/3Y)</span>
            <span className="flex items-center gap-1.5"><span className="inline-block h-2.5 w-2.5 rounded-full" style={{ background: "#a78bfa" }} /> 고객예탁금(KR)</span>
          </div>
          <span className="flex items-center gap-1.5"><Icon name="Landmark" size={12} /> 데이터는 거시 흐름을 반영한 시뮬레이션이며 투자 조언이 아닙니다.</span>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KostolanyEggDashboard />);
  </script>

  <script>
    // PWA service worker 등록 (HTTPS 또는 localhost에서만 동작)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    // 진단: 렌더 실패 시 '로딩 중'에 머무르지 않고 원인을 화면에 표시한다.
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return;
        var el = document.getElementById("loading");
        if (!el) return;
        shown = true;
        el.style.color = "#f87171";
        el.style.whiteSpace = "pre-wrap";
        el.style.padding = "40px 20px";
        el.style.textAlign = "left";
        el.style.fontFamily = "ui-monospace, monospace";
        el.style.fontSize = "13px";
        el.textContent = "대시보드를 불러오지 못했습니다.\n\n" + msg;
      }
      window.addEventListener("error", function (e) {
        show("오류: " + (e.message || e.error) + "\n(F12 → Console에서 상세 확인)");
      });
      setTimeout(function () {
        if (!document.getElementById("loading")) return; // 정상 렌더됨
        var missing = [];
        if (typeof React === "undefined") missing.push("React");
        if (typeof ReactDOM === "undefined") missing.push("ReactDOM");
        if (typeof PropTypes === "undefined") missing.push("PropTypes");
        if (typeof Recharts === "undefined") missing.push("Recharts");
        if (typeof Babel === "undefined") missing.push("Babel");
        show(
          missing.length
            ? "CDN 로드 실패: " + missing.join(", ") +
              "\n네트워크 또는 unpkg.com 차단 여부를 확인하세요."
            : "라이브러리는 모두 로드됐지만 렌더되지 않았습니다.\nF12 → Console 오류를 확인하세요."
        );
      }, 8000);
    })();
  </script>
</body>
